<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DIP Lab Basics</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: "Segoe UI", Arial, sans-serif; background: #f4f6f8; color: #1f2933; }
        header { background: #fff; border-bottom: 1px solid #e4e7eb; padding: 14px 24px; }
        header h1 { margin: 0; font-size: 20px; }
        header span { color: #7b8794; font-size: 14px; }
        main { display: grid; grid-template-columns: 300px 1fr; gap: 20px; padding: 20px 24px; }
        .card { background: #fff; border: 1px solid #e4e7eb; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
        .card h2 { margin: 0 0 10px; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: #7b8794; }
        .topic { font-size: 12px; color: #7b8794; margin: 10px 0 4px; }
        .tool { display: block; width: 100%; text-align: left; padding: 8px 10px; margin-bottom: 4px;
                border: 1px solid #e4e7eb; border-radius: 8px; background: #fff; cursor: pointer; font-size: 14px; }
        .tool.active { background: #2563eb; color: #fff; border-color: #2563eb; }
        .info { background: #f4f6f8; border-radius: 8px; padding: 10px; font-size: 14px; }
        .formula { font-family: Consolas, monospace; font-size: 13px; color: #2563eb; margin-top: 6px; }
        label { display: block; margin-top: 12px; font-size: 14px; }
        input[type=range], select { width: 100%; margin-top: 4px; }
        button.sample { border: 1px solid #e4e7eb; background: #fff; border-radius: 999px; padding: 4px 12px; cursor: pointer; }
        .pictures { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .pictures img { width: 100%; max-height: 420px; object-fit: contain; background: #e4e7eb; border-radius: 8px; }
        .caption { text-align: center; font-size: 13px; color: #7b8794; margin-bottom: 6px; }
        canvas { width: 100%; height: 120px; background: #f4f6f8; border-radius: 8px; }
        #note { margin-top: 12px; color: #1e40af; font-size: 14px; min-height: 20px; }
        .download { display: inline-block; margin-top: 12px; background: #2563eb; color: #fff; padding: 8px 16px;
                    border-radius: 8px; text-decoration: none; font-size: 14px; }
        .hidden { display: none; }
        .settings { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 20px; align-items: start; }
        .settings h2, .settings .info { grid-column: 1 / -1; }
        .settings #controls { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr; gap: 0 20px; }
        .settings #refBox { grid-column: 1 / -1; }
    </style>
</head>
<body>
    <header>
        <h1>DIP Lab Basics</h1>
        <span>Our Digital Image Processing lab topics, live on any picture</span>
    </header>

    <main>
        <!-- ===================== left: picture, tools, settings ===================== -->
        <aside>
            <div class="card">
                <h2>1. Choose a picture</h2>
                <input type="file" id="file" accept="image/*">
                <p style="font-size:13px;color:#7b8794;margin:10px 0 0">or a sample:
                    <button class="sample" data-src="/static/samples/cat.jpg">Cat</button>
                    <button class="sample" data-src="/static/samples/coffee.jpg">Coffee</button>
                </p>
            </div>

            <div class="card">
                <h2>2. Choose a tool</h2>
                <div id="toolList"></div>
            </div>

        </aside>

        <!-- ===================== right: before / after + histograms ===================== -->
        <section>
            <div class="card settings">
                <h2>3. Settings</h2>
                <div class="info"><span id="info">Pick a tool.</span><div class="formula" id="formula"></div></div>
                <div id="controls"></div>
                <div id="refBox" class="hidden">
                    <label>Reference picture <input type="file" id="refFile" accept="image/*"></label>
                </div>
            </div>
            <div class="card">
                <div class="pictures">
                    <div><div class="caption">Original</div><img id="imgOriginal" alt=""></div>
                    <div><div class="caption" id="resultCaption">Result</div><img id="imgResult" alt=""></div>
                </div>
                <div id="note"></div>
                <a class="download hidden" id="download" download="result.png">Download result</a>
            </div>
            <div class="card">
                <h2>Histograms (how many pixels have each gray level 0 - 255)</h2>
                <div class="pictures">
                    <div><div class="caption">Original</div><canvas id="histOriginal" width="400" height="120"></canvas></div>
                    <div><div class="caption">Result</div><canvas id="histResult" width="400" height="120"></canvas></div>
                </div>
            </div>
        </section>
    </main>

    <script>
        // the tool list comes from app.py (TOOLS), as [name, tool] pairs in order
        const TOOL_LIST = {{ tools | tojson }};
        const TOOLS = Object.fromEntries(TOOL_LIST);
        let picture = null;        // the chosen picture (a File)
        let reference = null;      // second picture, only for Histogram Matching
        let currentTool = null;
        let timer = null;
        const $ = id => document.getElementById(id);

        // ---------- draw the tool buttons, grouped by topic ----------
        let lastTopic = "";
        for (const [key, tool] of TOOL_LIST) {
            if (tool.topic !== lastTopic) {
                $("toolList").insertAdjacentHTML("beforeend", `<div class="topic">${tool.topic}</div>`);
                lastTopic = tool.topic;
            }
            const b = document.createElement("button");
            b.className = "tool";
            b.textContent = tool.label;
            b.dataset.key = key;
            b.onclick = () => chooseTool(key);
            $("toolList").appendChild(b);
        }

        // ---------- choosing a tool: show its explanation and sliders ----------
        function chooseTool(key) {
            currentTool = key;
            const tool = TOOLS[key];
            document.querySelectorAll(".tool").forEach(b => b.classList.toggle("active", b.dataset.key === key));
            $("info").textContent = tool.info;
            $("formula").textContent = tool.formula;
            $("resultCaption").textContent = "Result: " + tool.label;
            $("refBox").classList.toggle("hidden", !tool.needs_ref);

            $("controls").innerHTML = "";
            for (const c of tool.controls) {
                const label = document.createElement("label");
                let input;
                if (Array.isArray(c[2])) {                  // [name, label, [choices]]  -> dropdown
                    input = document.createElement("select");
                    c[2].forEach(v => input.add(new Option(v, v)));
                    label.textContent = c[1];
                } else {                                    // [name, label, min, max, step, default] -> slider
                    input = document.createElement("input");
                    input.type = "range";
                    [input.min, input.max, input.step, input.value] = c.slice(2);
                    label.textContent = `${c[1]}: `;
                    const value = document.createElement("b");
                    value.textContent = input.value;
                    label.appendChild(value);
                    input.addEventListener("input", () => { value.textContent = input.value; });
                }
                input.name = c[0];
                input.addEventListener("input", runSoon);
                label.appendChild(input);
                $("controls").appendChild(label);
            }
            run();
        }

        // ---------- send the picture + settings to Python (/process) ----------
        function runSoon() {              // wait until the slider stops moving for a moment
            clearTimeout(timer);
            timer = setTimeout(run, 250);
        }

        async function run() {
            if (!picture || !currentTool) return;
            const form = new FormData();
            form.append("image", picture);
            form.append("tool", currentTool);
            if (reference) form.append("reference", reference);
            $("controls").querySelectorAll("input, select").forEach(el => form.append(el.name, el.value));

            const response = await fetch("/process", { method: "POST", body: form });
            const data = await response.json();
            if (data.error) { $("note").textContent = data.error; return; }

            $("imgOriginal").src = data.original;
            $("imgResult").src = data.result;
            $("note").textContent = data.note;
            $("download").href = data.result;
            $("download").classList.remove("hidden");
            drawHistogram($("histOriginal"), data.hist_original);
            drawHistogram($("histResult"), data.hist_result);
        }

        // ---------- draw a histogram: one bar per gray level ----------
        function drawHistogram(canvas, hist) {
            const ctx = canvas.getContext("2d");
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const max = Math.max(...hist);
            const barWidth = canvas.width / 256;
            ctx.fillStyle = "#2563eb";
            hist.forEach((count, level) => {
                const h = count / max * (canvas.height - 4);
                ctx.fillRect(level * barWidth, canvas.height - h, barWidth, h);
            });
        }

        // ---------- choosing pictures ----------
        function setPicture(file) {
            picture = file;
            $("imgOriginal").src = URL.createObjectURL(file);
            if (!currentTool) chooseTool("negative"); else run();
        }
        $("file").addEventListener("change", () => { if ($("file").files[0]) setPicture($("file").files[0]); });
        $("refFile").addEventListener("change", () => { reference = $("refFile").files[0]; run(); });
        document.querySelectorAll(".sample").forEach(b => b.addEventListener("click", async () => {
            const blob = await (await fetch(b.dataset.src)).blob();
            setPicture(new File([blob], "sample.jpg", { type: blob.type }));
        }));
    </script>
</body>
</html>
