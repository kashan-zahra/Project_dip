plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kazi.imagelab'
    compileSdk 35

    defaultConfig {
        applicationId "com.kazi.imagelab"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    // The app shows the SAME web files that go to Netlify:
    // "dip android app/web"  ->  one copy of the code for both versions.
    sourceSets {
        main {
            assets.srcDirs = ['../../web']
        }
    }

    // don't pack the website's download file (ImageLab.apk) or zips into the app itself
    androidResources {
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~:!*.apk:!*.zip'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.core:core:1.13.1'
}
